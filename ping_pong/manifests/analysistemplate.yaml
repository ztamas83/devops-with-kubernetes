apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: ex-cpu-usage
spec:
  metrics:
    - name: ex-cpu-usage
      initialDelay: 30s
      successCondition: result < 0.08
      provider:
        prometheus:
          address: https://monitoring.googleapis.com/v1/projects/k8s-course-512506/location/global/prometheus
          authentication:
            google: {}
          query: |
            scalar(
              sum(rate(container_cpu_usage_seconds_total{namespace="exercises", container!="", container!="POD"}[5m]))
            )
