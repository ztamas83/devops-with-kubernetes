name: Release application

on:
  push:
    # Only branch pushes; tag pushes (exercise releases) are excluded
    branches:
      - '**'
    paths-ignore:
      - '.github/workflows/remove_branch.yaml'

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: ${{ secrets.GKE_PROJECT }}
  GKE_CLUSTER: dwk-cluster
  GKE_ZONE: europe-north2-a
  REGISTRY: europe-north2-docker.pkg.dev
  REPOSITORY: dwk-repo
  SERVICE: dwk-project
  BRANCH: ${{ github.ref_name }}

# ...
jobs:
  build-publish-deploy:
    name: Build, Publish and Deploy
    runs-on: ubuntu-latest
    environment: GKE_PROJECT

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: "${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}"
          service_account: "${{ secrets.SERVICE_ACCOUNT }}"

      - name: 'Set up Cloud SDK'
        uses: google-github-actions/setup-gcloud@v3

      - name: 'Use gcloud CLI'
        run: gcloud info
      - run: gcloud --quiet auth configure-docker $REGISTRY
      - name: 'Get GKE credentials'
        uses: 'google-github-actions/get-gke-credentials@v3'
        with:
          cluster_name: '${{ env.GKE_CLUSTER }}'
          project_id: '${{ env.PROJECT_ID }}'
          location: '${{ env.GKE_ZONE }}'
      - name : 'Form the image name'
        run: |
          echo "FE_IMAGE_TAG=$REGISTRY/$PROJECT_ID/$REPOSITORY/todo-app:$BRANCH-$GITHUB_SHA" >> $GITHUB_ENV
          echo "BE_IMAGE_TAG=$REGISTRY/$PROJECT_ID/$REPOSITORY/todo-backend:$BRANCH-$GITHUB_SHA" >> $GITHUB_ENV

      - name: Build images
        run: |
          docker build --tag $FE_IMAGE_TAG todo_app
          docker build --tag $BE_IMAGE_TAG todo_backend

      - name: Publish
        run: | 
          docker push $FE_IMAGE_TAG
          docker push $BE_IMAGE_TAG

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v3

      - name: Install sops
        run: |
          curl -sSLo /usr/local/bin/sops https://github.com/getsops/sops/releases/download/v3.13.3/sops-v3.13.3.linux.amd64
          chmod +x /usr/local/bin/sops

      - name: Decrypt secrets
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: sops --decrypt infra/base/secrets.enc.yaml > infra/base/secrets.yaml

      - name: Set namespace
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$BRANCH" = "$DEFAULT_BRANCH" ]; then
            NAMESPACE=project
          else
            NAMESPACE=$BRANCH
          fi
          echo "NAMESPACE=$NAMESPACE" >> $GITHUB_ENV
          echo "Using namespace: $NAMESPACE"

      - name: Deploy
        run: |-
            if [ "$NAMESPACE" = "project" ]; then OVERLAY=prod; else OVERLAY=branch; fi
            cd k8s/$OVERLAY
            if [ "$OVERLAY" = "branch" ]; then kustomize edit set namespace $NAMESPACE; fi
            kubectl config set-context --current --namespace=$NAMESPACE
            kustomize edit set image IMAGE/BACKEND=$BE_IMAGE_TAG
            kustomize edit set image IMAGE/FRONTEND=$FE_IMAGE_TAG
            kustomize build . | kubectl apply -f -
            kubectl rollout status deployment
            kubectl get services -o wide