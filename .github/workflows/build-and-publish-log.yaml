name: Build and publish application

on:
  push:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: ${{ secrets.GKE_PROJECT }}
  GKE_CLUSTER: dwk-cluster
  GKE_ZONE: europe-north2-a
  REGISTRY: europe-north2-docker.pkg.dev
  REPOSITORY: dwk-repo
  SERVICE: dwk-project
  BRANCH: ${{ github.ref_name }}

jobs:
  build-publish:
    name: Build, Push, Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: "${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}"
          service_account: "${{ secrets.SERVICE_ACCOUNT }}"

      - name: "Set up Cloud SDK"
        uses: google-github-actions/setup-gcloud@v3

      - name: "Use gcloud CLI"
        run: gcloud info
      - run: gcloud --quiet auth configure-docker $REGISTRY
      - name: "Get GKE credentials"
        uses: "google-github-actions/get-gke-credentials@v3"
        with:
          cluster_name: "${{ env.GKE_CLUSTER }}"
          project_id: "${{ env.PROJECT_ID }}"
          location: "${{ env.GKE_ZONE }}"
      - name: "Form the image name"
        run: |
          echo "LOG_IMAGE_TAG=$REGISTRY/$PROJECT_ID/$REPOSITORY/log-app:$BRANCH-$GITHUB_SHA" >> $GITHUB_ENV
          echo "PINGPONG_IMAGE_TAG=$REGISTRY/$PROJECT_ID/$REPOSITORY/ping-pong:$BRANCH-$GITHUB_SHA" >> $GITHUB_ENV

      - name: Build images
        run: |
          docker build --tag $LOG_IMAGE_TAG log_service
          docker build --tag $PINGPONG_IMAGE_TAG ping_pong

      - name: Publish
        run: |
          docker push $LOG_IMAGE_TAG
          docker push $PINGPONG_IMAGE_TAG

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v3

      - name: Use right images
        working-directory: k8s_log
        run: |
          kustomize edit set image IMAGE/LOG=$LOG_IMAGE_TAG
          kustomize edit set image IMAGE/PING_PONG=$PINGPONG_IMAGE_TAG

      - name: commit kustomization.yaml to GitHub
        uses: EndBug/add-and-commit@v10
        with:
          add: "k8s_log/kustomization.yaml"
          message: New version released ${{ github.sha }}
