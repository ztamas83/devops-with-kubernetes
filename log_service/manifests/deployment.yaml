apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-app-dep
  namespace: exercises
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-app
  template:
    metadata:
      labels:
        app: log-app
    spec:
      volumes: # Define volume
        - name: logs-volume
          persistentVolumeClaim:
            claimName: log-pvc
      containers:
        - name: log-generator
          image: ztamas/log-app:2.1
          volumeMounts: # Mount volume
            - name: logs-volume
              mountPath: /usr/src/app/files
          env:
            - name: PORT
              value: "3000"
            - name: LOG_PATH
              value: "/usr/src/app/files"
        - name: log-server
          image: ztamas/log-app:2.1
          volumeMounts: # Mount volume
            - name: logs-volume
              mountPath: /usr/src/app/files
          env:
            - name: SERVER
              value: "1"
            - name: LOG_PATH
              value: "/usr/src/app/files"
            - name: PORT
              value: "3000"
            - name: PING_SVC_URL
              value: "http://pingpong-svc:2002"
