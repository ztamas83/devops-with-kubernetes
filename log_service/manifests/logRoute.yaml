apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: log-router
  namespace: exercises
spec:
  parentRefs:
  - name: exercise-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /status
      backendRefs:
      - name: logoutput-svc
        port: 80
