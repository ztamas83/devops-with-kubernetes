apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: todoapp-router
  namespace: project
spec:
  parentRefs:
  - name: project-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
      - name: todo-app-svc
        port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /api/image
      backendRefs:
      - name: todo-app-svc
        port: 80


