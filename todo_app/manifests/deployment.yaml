apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-app-dep
  namespace: project
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: todo-app
  template:
    metadata:
      labels:
        app: todo-app
    spec:
      volumes: # Define volume
        - name: images-volume
          persistentVolumeClaim:
            claimName: images-pvc
      securityContext:
        fsGroup: 1000
      containers:
        - name: todo-app
          image: IMAGE/FRONTEND
          volumeMounts:
            - name: images-volume
              mountPath: /usr/src/app/images
          envFrom:
            - configMapRef:
                name: todo-app-cm
          env:
            - name: PORT
              value: "3000"
          ports:
            - name: http
              containerPort: 3000
