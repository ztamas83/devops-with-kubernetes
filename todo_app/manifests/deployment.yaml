apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-app-dep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-app
  template:
    metadata:
      labels:
        app: todo-app
    spec:
      volumes: # Define volume
        - name: images-volume
          persistentVolumeClaim:
            claimName: images-pvc
      containers:
        - name: todo-app
          image: ztamas/todo-app:2.2
          volumeMounts:
            - name: images-volume
              mountPath: /usr/src/app/images
          env:
            - name: PORT
              value: "3000"
            - name: IMAGE_DIR
              value: /usr/src/app/images

