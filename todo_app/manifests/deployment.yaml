apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-app-dep
  namespace: project
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: todo-app
  template:
    metadata:
      labels:
        app: todo-app
    spec:
      volumes: # Define volume
        - name: images-volume
          persistentVolumeClaim:
            claimName: images-pvc
      securityContext:
        fsGroup: 1000
      containers:
        - name: todo-app
          image: IMAGE/FRONTEND
          volumeMounts:
            - name: images-volume
              mountPath: /usr/src/app/images
          envFrom:
            - configMapRef:
                name: todo-app-cm
          env:
            - name: PORT
              value: "3000"
            - name: TODO_BACKEND_URL
              value: "http://todo-backend-svc"
          ports:
            - name: http
              containerPort: 3000
          resources:
            requests:
              cpu: 10m
              memory: 20Mi
            limits:
              cpu: 150m
              memory: 100Mi
          readinessProbe:
            initialDelaySeconds: 10 # Initial delay until the readiness is tested
            periodSeconds: 5 # How often to test
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            initialDelaySeconds: 10 # Initial delay until the readiness is tested
            periodSeconds: 5 # How often to test
            httpGet:
              path: /healthz
              port: http
