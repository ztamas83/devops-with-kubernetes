apiVersion: v1
kind: Service
metadata:
  name: todo-backend-svc
  namespace: project
spec:
  type: ClusterIP
  selector:
    app: todo-backend # This is the app as declared in the deployment.
  ports:
    - port: 2101 # This is the port that is available outside. Value for nodePort can be between 30000-32767
      protocol: TCP
      targetPort: http
      name: http