apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: todobackend-router
  namespace: project
spec:
  parentRefs:
  - name: gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /todos
      backendRefs:
      - name: todo-backend-svc
        port: 80


