apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: project
resources:
  - ../base
  - ../gateway
  - namespace.yaml
  - images-pvc.yaml
patches:
  - target:
      kind: Gateway
      name: gateway
    patch: |-
      - op: replace
        path: /metadata/name
        value: project-gateway
