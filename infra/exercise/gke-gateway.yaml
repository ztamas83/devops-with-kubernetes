apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: exercise-gateway
spec:
  gatewayClassName: gke-l7-global-external-managed
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    allowedRoutes:
      kinds:
      - kind: HTTPRoute
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: exercise-route
  namespace: exercises
spec:
  parentRefs:
  - name: exercise-gateway
  rules:
    - matches:
      - path:
          type: PathPrefix
          value: /status
      backendRefs:
      - name: logoutput-svc
        port: 80
    - matches:
      - path:
          type: PathPrefix
          value: /pingpong
      backendRefs:
      - name: pingpong-svc
        port: 80

