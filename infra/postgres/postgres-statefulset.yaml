apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-stset
spec:
  serviceName: postgres-svc
  replicas: 1
  selector:
    matchLabels:
      app: postgres-app
  template:
    metadata:
      labels:
        app: postgres-app
    spec:
      containers:
      - name: postgres-app
        image: IMAGE/POSTGRES
        env:
          - name: POSTGRES_USER
            valueFrom:
              configMapKeyRef:
                name: infra-config
                key: POSTGRES_USER
          - name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: infra-secrets
                key: POSTGRES_PASSWORD
        ports:
        - containerPort: 5432
          name: db
        volumeMounts:
        - name: db
          mountPath: /var/lib/postgresql
        resources:
          requests:
            cpu: 250m
            memory: 100Mi
          limits:
            cpu: 400m
            memory: 500Mi
  volumeClaimTemplates:
  - metadata:
      name: db
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 1Gi
