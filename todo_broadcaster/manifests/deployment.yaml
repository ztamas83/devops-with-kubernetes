apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: todo-broadcaster-dep
  namespace: project
spec:
  replicas: 3
  selector:
    matchLabels:
      app: todo-broadcaster
  strategy:
    canary:
      steps:
        - setWeight: 50
        - pause:
            duration: 30s
  template:
    metadata:
      labels:
        app: todo-broadcaster
    spec:
      containers:
        - name: todo-broadcaster
          image: IMAGE/BROADCASTER
          envFrom:
            - configMapRef:
                name: nats-config
          env:
            - name: PORT
              value: "3000"
            - name: DISCORD_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: infra-secrets
                  key: DISCORD_WEBHOOK_URL
          ports:
            - name: http
              containerPort: 3000
          resources:
            requests:
              cpu: 10m
              memory: 20Mi
            limits:
              cpu: 250m
              memory: 200Mi
          readinessProbe:
            initialDelaySeconds: 10 # Initial delay until the readiness is tested
            periodSeconds: 5 # How often to test
            httpGet:
              path: /healthz
              port: http
